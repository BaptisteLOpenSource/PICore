[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
shell-words = "1"
thiserror = "2"
tempfile = "3"
toml = "0.8"
wait-timeout = "0.2"
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
